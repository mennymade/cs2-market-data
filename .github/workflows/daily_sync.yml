name: Daily CS2 Market Price Sync

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Multi-Market Waterfall Price Aggregator
        run: node scripts/update_market_prices.js

      - name: Commit and push updated prices
        run: |
          git config user.name "CS2 Market Bot"
          git config user.email "bot@cs2unboxlegends.local"
          git add prices_v1.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(market): automated daily multi-market price update [skip ci]" && git push origin main)
